# OmniSign Server Configuration
# ================================
# This file configures the Ktor-based OmniSign HTTP server.
# Place it as server.yml in the working directory, set the OMNISIGN_SERVER_CONFIG
# environment variable, or pass --config <path> on the command line.

# Network listener: bind host and plain-HTTP port. The default host is "127.0.0.1"
# (loopback) so a fresh install is reachable only from the same machine. To accept
# LAN or public connections, change `host` to "0.0.0.0" (all interfaces) or a
# specific IP — but the server will then require `tls:` or `proxy.enabled: true`
# below (loopback hosts are the only ones that skip the transport-security check
# because plain HTTP on a network-reachable interface would expose JWT tokens and
# OIDC callback parameters on the wire).
listen:
  host: "127.0.0.1"
  port: 18080

# When true, Ktor development mode is activated (auto-reload, verbose errors,
# internal exception messages echoed to clients via the catch-all error handler).
# Refuses to start when combined with a non-loopback host — set it to true only
# when binding to 127.0.0.1 or ::1 during local development. Must be false in
# production and any deployment reachable from the network.
development: false

# Reverse-proxy configuration. When enabled, TLS termination is delegated to an upstream
# proxy (e.g., nginx, Caddy, Traefik) and the server listens only on the plain HTTP
# connector. X-Forwarded-* headers are honored, BUT only when the TCP connection's source
# IP matches one of the entries in `trusted` — headers arriving from any other peer are
# ignored so an attacker reaching the Ktor port directly cannot spoof their client IP.
#
# proxy.enabled: true REQUIRES a non-empty proxy.trusted list — startup aborts otherwise.
# Use literal IPs (e.g. "127.0.0.1", "::1") or CIDR ranges (e.g. "10.0.0.0/24").
# Hostnames and "*" are rejected — hostnames pull in a DNS dependency and resolve
# inconsistently across platforms (localhost is 127.0.0.1 on some, ::1 on others);
# "*" would defeat the trust boundary entirely.
# proxy:
#   enabled: true
#   trusted:
#     - "127.0.0.1"
#     - "::1"

# In-memory per-IP request rate limiting.
# When enabled, protects auth and API endpoints from brute-force and DoS attacks.
# In proxy mode, client IPs are taken from X-Forwarded-For only for connections coming
# from a trusted proxy listed in proxy.trusted above.
# rateLimiting:
#   auth:
#     limit: 20               # max requests per IP per refillPeriodSeconds on /auth/* routes
#     refillPeriodSeconds: 60
#   api:
#     limit: 200              # max requests per IP per refillPeriodSeconds on API routes
#     refillPeriodSeconds: 60

# ─────────────────────────────────────────────────────────────────────────────
# SSO Authentication
# ──────────────────────────────────────────────────────────────────────────────
# Uncomment and configure one or more providers to enable SSO login.
# The base public URL used for OAuth2 redirect URIs can be overridden via the
# OMNISIGN_EXTERNAL_URL environment variable (recommended for production).
#
# Secrets — env vars ONLY (not YAML). YAML attempts to set any of these will fail
# startup with an error naming the env var to use instead:
#   OMNISIGN_JWT_SECRET                       — auth.session JWT signing secret
#   OMNISIGN_OIDC_<NAME>_CLIENT_SECRET        — per-OIDC-provider client_secret
#                                                (<NAME> = the provider's `name` field uppercased
#                                                with non-alphanumerics → `_`)
# Reason: YAML files end up in backups, log uploads, support bundles, container images,
# CI artifacts, and screen-shares; env vars stay in process memory. The previous shipped
# placeholders ("changeit", "YOUR_CLIENT_SECRET") were a documented copy-paste trap.
#
# auth:
#   # When true, all operational API endpoints require a valid JWT Bearer token.
#   # Must be combined with a non-empty providers list to be functional.
#   enabled: true
#   session:
#     # algorithm: HS512   # default; options: HS256, HS384, HS512 (HMAC, single-server deployments)
#     #                    #          RS256, RS384, RS512 (RSA — planned, not yet implemented)
#     #                    #          ES256, ES384, ES512 (ECDSA — planned, not yet implemented)
#     # HS512 is the recommended default. Asymmetric variants (RS*, ES*) are only needed
#     # when an external system must verify OmniSign tokens without the signing secret
#     # (e.g., multi-instance or third-party integrations). See JwtAlgorithmType KDoc.
#     issuer: omnisign
#     audience: omnisign-api
#     tokenExpirySeconds: 3600
#     # HMAC signing secret resolved from OMNISIGN_JWT_SECRET (required when auth.enabled: true).
#
#   # Return URLs the OmniSign web app may be handed back to after a browser login.
#   # Leave unset (the default) for a server with no browser front-end — the login callback
#   # then answers API clients with token JSON and performs no redirect. Set it to the exact
#   # page the web bundle is served from to let the browser app sign users in: after the IdP
#   # login the callback redirects here with a single-use hand-off code the app exchanges for
#   # tokens at POST /auth/exchange. Matching is EXACT — not a prefix, not a host — because a
#   # loose match would let the login endpoint deliver a hand-off code to a page an attacker
#   # controls. Entries must be absolute https URLs (http only for loopback dev hosts). Also
#   # set cors.allowCredentials: true below when the app is on a different origin to the API.
#   # allowedRedirectUris:
#   #   - "https://omnisign.example.com/"
#
#   providers:
#
#     # `allowedEmailDomains` is REQUIRED on every OIDC provider — there is no implicit
#     # allow-all default. Pick one of:
#     #   allowedEmailDomains: ["*"]                    # explicit allow-all (deliberate choice)
#     #   allowedEmailDomains: ["yourcompany.com"]      # restrict to one domain
#     #   allowedEmailDomains: ["a.com", "b.org"]       # restrict to several
#     # An empty list ([]) and a missing field are both rejected at server startup.
#
#     # Per-provider client_secret env var: OMNISIGN_OIDC_<NAME>_CLIENT_SECRET, e.g.
#     # name: "google"           → OMNISIGN_OIDC_GOOGLE_CLIENT_SECRET
#     # name: "google-workspace" → OMNISIGN_OIDC_GOOGLE_WORKSPACE_CLIENT_SECRET
#
#     # ── Google ───────────────────────────────────────────────────────────────
#     # client_secret env var: OMNISIGN_OIDC_GOOGLE_CLIENT_SECRET
#     - type: oidc
#       name: google
#       preset: GOOGLE
#       displayName: "Sign in with Google"
#       clientId: "YOUR_CLIENT_ID.apps.googleusercontent.com"
#       allowedEmailDomains: ["yourcompany.com"]   # restrict to org accounts only
#
#     # ── Microsoft Entra ID (Azure AD) ────────────────────────────────────────
#     # tenantId: "common" = multi-tenant, "organizations" = work/school only,
#     #           or a specific tenant GUID / primary domain.
#     # Use allowedEmailDomains to further restrict to specific domains within the tenant
#     # (e.g., if subsidiary companies share the same Entra ID tenant).
#     # client_secret env var: OMNISIGN_OIDC_MICROSOFT_CLIENT_SECRET
#     - type: oidc
#       name: microsoft
#       preset: MICROSOFT
#       displayName: "Sign in with Microsoft"
#       tenantId: "common"
#       clientId: "YOUR_APPLICATION_CLIENT_ID"
#       allowedEmailDomains: ["contoso.com"]       # restrict to contoso.com accounts only
#
#     # ── Amazon Cognito ───────────────────────────────────────────────────────
#     # tenantId format: "{region}/{userPoolId}"
#     # client_secret env var: OMNISIGN_OIDC_COGNITO_CLIENT_SECRET
#     - type: oidc
#       name: cognito
#       preset: AMAZON_COGNITO
#       displayName: "Sign in with Amazon"
#       tenantId: "eu-central-1/eu-central-1_XXXXXXXXX"
#       clientId: "YOUR_APP_CLIENT_ID"
#       allowedEmailDomains: ["*"]                 # private user pool — operator is the boundary
#
#     # ── Keycloak (self-hosted) ───────────────────────────────────────────────
#     # tenantId format: "{host}/{realm}"
#     # client_secret env var: OMNISIGN_OIDC_KEYCLOAK_CLIENT_SECRET
#     - type: oidc
#       name: keycloak
#       preset: KEYCLOAK
#       displayName: "Sign in with Keycloak"
#       tenantId: "keycloak.example.com/myrealm"
#       clientId: "omnisign"
#       allowedEmailDomains: ["*"]                 # self-hosted realm — operator is the boundary
#
#     # ── GitHub ───────────────────────────────────────────────────────────────
#     # GitHub uses OAuth2 (not full OIDC). Email scope requires "user:email".
#     # Use allowedEmailDomains to restrict to specific org/company email addresses.
#     # client_secret env var: OMNISIGN_OIDC_GITHUB_CLIENT_SECRET
#     - type: oidc
#       name: github
#       preset: GITHUB
#       displayName: "Sign in with GitHub"
#       clientId: "YOUR_GITHUB_CLIENT_ID"
#       scopes: ["read:user", "user:email"]
#       allowedEmailDomains: ["yourcompany.com"]
#
#     # ── GitLab ───────────────────────────────────────────────────────────────
#     # client_secret env var: OMNISIGN_OIDC_GITLAB_CLIENT_SECRET
#     - type: oidc
#       name: gitlab
#       preset: GITLAB
#       displayName: "Sign in with GitLab"
#       clientId: "YOUR_GITLAB_APP_ID"
#       allowedEmailDomains: ["yourcompany.com"]
#
#     # ── Auth0 ────────────────────────────────────────────────────────────────
#     # tenantId: your Auth0 domain (e.g. "myapp.eu.auth0.com")
#     # client_secret env var: OMNISIGN_OIDC_AUTH0_CLIENT_SECRET
#     - type: oidc
#       name: auth0
#       preset: AUTH0
#       displayName: "Sign in with Auth0"
#       tenantId: "myapp.eu.auth0.com"
#       clientId: "YOUR_AUTH0_CLIENT_ID"
#       allowedEmailDomains: ["*"]                 # tenant is the boundary
#
#     # ── Apple ────────────────────────────────────────────────────────────────
#     # client_secret env var: OMNISIGN_OIDC_APPLE_CLIENT_SECRET
#     - type: oidc
#       name: apple
#       preset: APPLE
#       displayName: "Sign in with Apple"
#       clientId: "YOUR_APPLE_SERVICE_ID"
#       allowedEmailDomains: ["yourcompany.com"]   # Apple is public — domain-restrict
#
#     # ── eduID.cz / Czech academic federation (CESNET e-INFRA OIDC proxy) ─────
#     # The EDUID_CZ preset targets the login.e-infra.cz hub, which fronts the whole
#     # eduID.cz SAML federation as ONE OIDC provider — a single clientId/clientSecret
#     # grants access to users from ALL ~60 federated Czech universities (Charles,
#     # Masaryk, University of Ostrava, CTU Prague, …). Users pick their home institution
#     # on the eduID.cz page, so the clientId does NOT restrict which institution logs in;
#     # you MUST restrict it yourself.
#     # Register an OIDC client (self-service) at https://spadmin.e-infra.cz/ — set the
#     # redirect URI and pick scopes there; the default openid/email/profile set is enough
#     # for the email-domain restriction below.
#     # client_secret env var: OMNISIGN_OIDC_EDUID_CLIENT_SECRET
#     - type: oidc
#       name: eduid
#       preset: EDUID_CZ
#       displayName: "Sign in with eduID.cz"
#       clientId: "YOUR_EDUID_CLIENT_ID"
#       # Restrict to the University of Ostrava by institutional e-mail domain — the reliable
#       # per-institution gate on this proxy. Do NOT gate on eduperson_scoped_affiliation or
#       # organization here: the proxy fixes eduperson_scoped_affiliation to "@einfra.cesnet.cz"
#       # (E-INFRA membership, not the home university) and exposes organization as a display
#       # name, not a domain — so "staff@osu.cz" / "osu.cz" would never match. Finer
#       # affiliation/role gating uses the proxy's voperson_external_affiliation or
#       # eduperson_entitlement claims (request the matching scope, then confirm the exact
#       # values against a real token):
#       # https://aai.cesnet.cz/en/index/documentation/sp/proxy/attributes_and_scopes
#       allowedEmailDomains: ["osu.cz"]

# Operation gating: which API operations the server exposes and which certificate
# aliases are eligible for signing. The two fields are tightly coupled —
# certificateAliases only matters when SIGN is in `allowed`.
#
# `allowed` defaults to [VALIDATE] only. SIGN and TIMESTAMP are opt-in because they
# expose the server's signing certificates or timestamping endpoints to all API
# callers.
#
# At least one operation must be enabled: an explicit `allowed: []` is rejected at startup.
# Omit the whole operations block for the validate-only default; you cannot disable everything.
operations:
  allowed:
    - VALIDATE
  # Uncomment to also enable signing or timestamping (e.g., for institutional
  # seal/HSM deployments):
  #  - SIGN
  #  - TIMESTAMP
  #
  # When SIGN is enabled, restrict which certificate aliases may be used via the API.
  # If omitted (null), all discovered signing certificates are available. An explicit empty
  # list ([]) while SIGN is enabled is rejected at startup — it would permit no certificate
  # at all, making SIGN useless.
  # certificateAliases:
  #   - "university-seal"
  #   - "department-stamp"
  #
  # File signing keystore. Set this when the server signs with a PKCS#12 (.p12/.pfx) file rather
  # than a PKCS#11 token/HSM. When set (and SIGN enabled), every sign request signs from this
  # keystore, and certificateAliases selects the entry within it (a request omitting the alias uses
  # the keystore's sole key). The password is env-var ONLY — OMNISIGN_SIGNING_KEYSTORE_PASSWORD,
  # required when this is set — never in YAML, mirroring the TLS keystore. Setting a path while SIGN
  # is not enabled is rejected at startup. Leave unset for a PKCS#11/HSM-backed deployment.
  # signingKeystorePath: "/etc/omnisign/signing.p12"

# Signing / validation policy file - the server's equivalent of the desktop "global
# settings + profiles". Loaded READ-ONLY at startup. Holds everything about HOW the server
# signs and validates: default algorithms, OCSP/CRL timeouts, TSA, validation policy, and
# named profiles - so this server.yml stays focused on exposure and security. When omitted,
# the server runs with built-in defaults and no profiles (the home-directory config file is
# never read). YAML is primary; a path ending in .json is parsed as JSON. Secrets never go
# in this file (a TSA password is resolved from the environment). See signing.example.yml.
# signingConfigFile: "/etc/omnisign/signing.yml"

# Persistent, writable directory for the server's trust store, reconciled at startup from the
# signing.yml `trustedCertificates` references (content-addressed DER files plus a CBOR index).
# Keep it separate from the read-only policy and source cert files above. When omitted, it
# defaults to a `trusted-certs` directory in the server's working directory — in the Docker
# image that resolves to /app/trusted-certs, which is a mounted volume, so leave it unset there.
# Set it only to relocate the store onto a specific mount.
# trustStoreDir: "/var/lib/omnisign/trusted-certs"

# TLS / SSL configuration.
# Uncomment and fill in to enable direct HTTPS with TLS 1.2/1.3 and HTTP/2. When `host`
# is set to anything other than a loopback address (127.0.0.1, ::1, localhost), the
# server requires either this `tls:` block or `proxy.enabled: true` — otherwise startup
# fails because plain HTTP on a network-reachable interface would expose JWT bearer
# tokens, OIDC callback parameters, and refresh tokens to any on-path observer.
#
# Passwords are env-var ONLY (YAML attempts to set them fail startup with a targeted
# error). Required when `tls:` is configured:
#   OMNISIGN_TLS_KEYSTORE_PASSWORD       — keystore password (required)
#   OMNISIGN_TLS_PRIVATE_KEY_PASSWORD    — private-key password (optional; falls back to
#                                          OMNISIGN_TLS_KEYSTORE_PASSWORD when unset)
# tls:
#   port: 18443                       # TLS connector port (default 18443)
#   keystorePath: "/path/to/keystore.p12"
#   keyAlias: "omnisign"
#
#   # HTTP Strict Transport Security (HSTS).
#   # Only enable when ALL traffic to the server arrives over HTTPS.
#   # Sending this header over plain HTTP is a protocol error and can lock users out.
#   # When behind a TLS-terminating proxy, let the proxy inject this header instead.
#   #
#   # Start with a short maxAgeSeconds (e.g., 300) during initial rollout; raise to
#   # 31536000 (one year) once you are confident HTTPS is stable. preload: true requires
#   # includeSubDomains: true and maxAgeSeconds >= 31536000, plus manual submission to
#   # https://hstspreload.org/.
#   # hsts:
#   #   maxAgeSeconds: 31536000     # one year (default)
#   #   includeSubDomains: true     # apply policy to subdomains (default)
#   #   preload: false              # include preload directive (default)

# CORS configuration for the web frontend. REQUIRED: cors.allowedOrigins must be set to
# either a list of explicit origins or ["*"] to allow any origin. Empty list and missing
# `cors:` block are both rejected at startup so the three operator intents "didn't
# configure CORS", "explicitly allow all", and "explicitly deny all" can never collapse
# into the same silent-disable runtime.
#
# Entries may be bare host ("example.com"), host:port ("example.com:18443"), or full URL
# ("https://example.com:18443") — the http(s):// prefix is stripped.
#
# The defaults below cover the three common Compose / Wasm / JS local dev-server ports
# so the local dev workflow works out of the box. Replace them with your production
# origins (or use ["*"] for an intentionally public API) before deployment.
cors:
  allowedOrigins:
    - "http://localhost:8080"   # Compose Multiplatform Wasm dev server (default)
    - "http://localhost:3000"   # generic dev server (Next.js / CRA)
    - "http://localhost:5173"   # Vite dev server
  # Allow the browser to send its session cookie on cross-origin requests and read the
  # response. Defaults to false, which is correct whenever clients authenticate with a JWT
  # bearer token — that travels in the Authorization header, which is not a credential and
  # needs no opt-in. Set it to true only to serve the OmniSign web app from a DIFFERENT
  # origin to this API (app.example.com + api.example.com, or one host on two ports), where
  # the app relies on the HttpOnly refresh cookie to resume a session across reloads. It is
  # incompatible with allowedOrigins: ["*"] and startup rejects the pair — with credentials
  # enabled the wildcard is reflected back as the caller's own origin, which would let any
  # site the user visits read authenticated responses. List your app's origin explicitly.
  # allowCredentials: true

# Maximum upload file size in bytes (default: 100 MB).
maxFileSize: 104857600
