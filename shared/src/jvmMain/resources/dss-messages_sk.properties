# Slovak (sk) translation of the EU DSS validation message bundle (dss-messages.properties).
# English original to translate from: https://github.com/esig/dss/blob/6.5.1/dss-i18n/src/main/resources/dss-messages.properties
# Loaded by DSS I18nProvider when the validator locale is sk (see DssValidationRepository).
# Keys mirror DSS 6.5.1 one-for-one; DssMessagesSlovakCoverageTest guards completeness on upgrades.
# Terminology: official Slovak eIDAS (Reg. (EU) No 910/2014 as amended by Reg. (EU) 2024/1183) + standard Slovak PKI usage.
# Attestation, PID and trusted-entity terms follow Implementing Regs. (EU) 2024/2977 and 2024/2980.

