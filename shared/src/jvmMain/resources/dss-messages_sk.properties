# Semantics (ETSI EN 319 102-1 v1.3.1 (table 5))
SEMANTICS_TOTAL_PASSED=Proces validácie podpisu vyústil do stavu TOTAL-PASSED na základe nasledujúcich skutočností: kontrola formátu bola úspešná; kryptografické kontroly podpisu boli úspešné (vrátane kontrol hašov jednotlivých dátových objektov, ktoré boli podpísané nepriamo); všetky obmedzenia použiteľné na certifikát podpisujúcej osoby boli kladne overené (napr. podpisový certifikát bol teda zhodnotený ako dôveryhodný); a podpis bol kladne overený voči obmedzeniam pre validáciu, a je teda považovaný za vyhovujúci týmto obmedzeniam.
SEMANTICS_TOTAL_FAILED=Proces validácie podpisu vyústil do stavu TOTAL-FAILED, pretože kontrola formátu zlyhala, kryptografické kontroly podpisu zlyhali (vrátane kontrol hašov jednotlivých dátových objektov, ktoré boli podpísané nepriamo) alebo bolo preukázané, že podpisový certifikát bol v čase vytvorenia podpisu neplatný.
SEMANTICS_INDETERMINATE=Dostupné informácie sú nedostatočné na to, aby bolo možné stanoviť, či je podpis v stave TOTAL-PASSED alebo TOTAL-FAILED.
SEMANTICS_PASSED=Proces validácie bol úspešný
SEMANTICS_FAILED=Proces validácie zlyhal
# Semantics (ETSI EN 319 102-1 v1.3.1 (table 6))
# TOTAL-FAILED
SEMANTICS_FORMAT_FAILURE=Podpis nie je v súlade s niektorým zo základných štandardov do tej miery, že ho stavebný blok kryptografickej validácie nie je schopný spracovať.
SEMANTICS_HASH_FAILURE=Proces validácie podpisu vyústil do stavu TOTAL-FAILED, pretože aspoň jeden haš podpísaného dátového objektu, ktorý bol zahrnutý do procesu podpisu, nezodpovedá príslušnej hodnote hašu v podpise.
SEMANTICS_SIG_CRYPTO_FAILURE=Proces validácie podpisu vyústil do stavu TOTAL-FAILED, pretože hodnotu podpisu v podpise nebolo možné overiť pomocou verejného kľúča podpisujúcej osoby v podpisovom certifikáte.
SEMANTICS_REVOKED=Proces validácie podpisu vyústil do stavu TOTAL-FAILED, pretože: podpisový certifikát bol zrušený; a existuje dôkaz, že podpis bol vytvorený po čase zrušenia.
SEMANTICS_EXPIRED=Proces validácie podpisu vyústil do stavu TOTAL-FAILED, pretože existuje dôkaz, že podpis bol vytvorený po dátume exspirácie (notAfter) podpisového certifikátu.
SEMANTICS_NOT_YET_VALID=Proces validácie podpisu vyústil do stavu TOTAL-FAILED, pretože existuje dôkaz, že podpis bol vytvorený pred dátumom vydania (notBefore) podpisového certifikátu.
# INDETERMINATE
SEMANTICS_SIG_CONSTRAINTS_FAILURE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože jeden alebo viac atribútov podpisu nezodpovedá obmedzeniam pre validáciu.
SEMANTICS_CHAIN_CONSTRAINTS_FAILURE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože reťazec certifikátov použitý v procese validácie nezodpovedá obmedzeniam pre validáciu vzťahujúcim sa na certifikát.
SEMANTICS_CERTIFICATE_CHAIN_GENERAL_FAILURE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože sada certifikátov dostupných na validáciu reťazca vyvolala chybu z bližšie neurčeného dôvodu.
SEMANTICS_CRYPTO_CONSTRAINTS_FAILURE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože aspoň jeden z algoritmov, ktoré boli použité v materiáli (napr. hodnota podpisu, certifikát...) zapojenom do validácie podpisu, alebo veľkosť kľúča použitého s takým algoritmom, je pod požadovanou úrovňou kryptografickej bezpečnosti, a: tento materiál bol vytvorený po čase, do ktorého bol tento algoritmus/kľúč považovaný za bezpečný (ak je taký čas známy); a tento materiál nie je chránený dostatočne silnou časovou pečiatkou aplikovanou pred časom, do ktorého bol algoritmus/kľúč považovaný za bezpečný (ak je taký čas známy).
SEMANTICS_POLICY_PROCESSING_ERROR=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože daný súbor formálnej politiky nebolo možné z akéhokoľvek dôvodu spracovať (napr. nedostupný, nečitateľný, nezhoda hašu atď.).
SEMANTICS_SIGNATURE_POLICY_NOT_AVAILABLE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože elektronický dokument obsahujúci podrobnosti politiky nie je dostupný.
SEMANTICS_TIMESTAMP_ORDER_FAILURE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože nie sú dodržané niektoré obmedzenia týkajúce sa poradia časových pečiatok podpisu a/alebo časových pečiatok podpísaných dátových objektov.
SEMANTICS_NO_SIGNING_CERTIFICATE_FOUND=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože podpisový certifikát nemožno identifikovať.
SEMANTICS_NO_CERTIFICATE_CHAIN_FOUND=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože pre identifikovaný podpisový certifikát nebol nájdený žiadny reťazec certifikátov.
SEMANTICS_REVOKED_NO_POE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože podpisový certifikát bol k dátumu/času validácie zrušený. Algoritmus validácie podpisu však nemôže stanoviť, či čas podpisu leží pred časom zrušenia alebo po ňom.
SEMANTICS_REVOKED_CA_NO_POE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože bol nájdený aspoň jeden reťazec certifikátov, ale certifikát medziľahlej CA je zrušený.
SEMANTICS_OUT_OF_BOUNDS_NOT_REVOKED=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože podpisový certifikát je k dátumu/času validácie po exspirácii alebo zatiaľ neplatný a algoritmus validácie podpisu nemôže stanoviť, že čas podpisu leží v intervale platnosti podpisového certifikátu. O certifikáte je známe, že nie je zrušený.
SEMANTICS_OUT_OF_BOUNDS_NO_POE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože podpisový certifikát je k dátumu/času validácie po exspirácii alebo zatiaľ neplatný a algoritmus validácie podpisu nemôže stanoviť, že čas podpisu leží v intervale platnosti podpisového certifikátu.
SEMANTICS_REVOCATION_OUT_OF_BOUNDS_NO_POE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože podpisový certifikát informácií o zrušení podpisového certifikátu podpisu je k dátumu/času validácie po exspirácii alebo zatiaľ neplatný a algoritmus validácie podpisu nemôže stanoviť, že čas vydania informácií o zrušení leží v intervale platnosti podpisového certifikátu týchto informácií o zrušení.
SEMANTICS_CRYPTO_CONSTRAINTS_FAILURE_NO_POE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože aspoň jeden z algoritmov, ktoré boli použité v objektoch (napr. hodnota podpisu, certifikát atď.) zapojených do validácie podpisu, alebo veľkosť kľúča použitého s takým algoritmom, je pod požadovanou úrovňou kryptografickej bezpečnosti, a neexistuje dôkaz, že tento materiál bol vytvorený pred časom, do ktorého bol tento algoritmus/kľúč považovaný za bezpečný.
SEMANTICS_NO_POE=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože chýba POE na to, aby bolo možné stanoviť, že podpísaný objekt bol vytvorený pred nejakou kompromitujúcou udalosťou (napr. prelomený algoritmus).
SEMANTICS_TRY_LATER=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože pomocou dostupných informácií nemožno splniť všetky obmedzenia. Môže to však byť možné s využitím dodatočných informácií o zrušení, ktoré budú dostupné v neskoršom čase.
SEMANTICS_SIGNED_DATA_NOT_FOUND=Proces validácie podpisu vyústil do stavu INDETERMINATE, pretože podpísané dáta nemožno získať.
