# Semantics (ETSI EN 319 102-1 v1.3.1 (table 5))
SEMANTICS_TOTAL_PASSED=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-PASSED na základě následujících skutečností: kontrola formátu byla úspěšná; kryptografické kontroly podpisu byly úspěšné (včetně kontrol otisků jednotlivých datových objektů, které byly podepsány nepřímo); veškerá omezení použitelná na certifikát podepisující osoby byla kladně ověřena (např. podpisový certifikát byl tudíž shledán důvěryhodným); a podpis byl kladně ověřen vůči omezením pro ověřování platnosti, a je tedy považován za vyhovující těmto omezením.
SEMANTICS_TOTAL_FAILED=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-FAILED, protože kontrola formátu selhala, kryptografické kontroly podpisu selhaly (včetně kontrol otisků jednotlivých datových objektů, které byly podepsány nepřímo) nebo bylo prokázáno, že podpisový certifikát byl v čase vytvoření podpisu neplatný.
SEMANTICS_INDETERMINATE=Dostupné informace jsou nedostatečné k tomu, aby bylo možné stanovit, zda je podpis ve stavu TOTAL-PASSED nebo TOTAL-FAILED.
SEMANTICS_PASSED=Proces ověřování platnosti byl úspěšný
SEMANTICS_FAILED=Proces ověřování platnosti selhal
# Semantics (ETSI EN 319 102-1 v1.3.1 (table 6))
# TOTAL-FAILED
SEMANTICS_FORMAT_FAILURE=Podpis není v souladu s některým ze základních standardů do té míry, že jej stavební blok kryptografického ověření není schopen zpracovat.
SEMANTICS_HASH_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-FAILED, protože alespoň jeden otisk podepsaného datového objektu, který byl zahrnut do procesu podpisu, neodpovídá příslušné hodnotě otisku v podpisu.
SEMANTICS_SIG_CRYPTO_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-FAILED, protože hodnotu podpisu v podpisu nebylo možné ověřit pomocí veřejného klíče podepisující osoby v podpisovém certifikátu.
SEMANTICS_REVOKED=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-FAILED, protože: podpisový certifikát byl zneplatněn; a existuje důkaz, že podpis byl vytvořen po čase zneplatnění.
SEMANTICS_EXPIRED=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-FAILED, protože existuje důkaz, že podpis byl vytvořen po datu expirace (notAfter) podpisového certifikátu.
SEMANTICS_NOT_YET_VALID=Proces ověřování platnosti podpisu vyústil ve stav TOTAL-FAILED, protože existuje důkaz, že podpis byl vytvořen před datem vydání (notBefore) podpisového certifikátu.
# INDETERMINATE
SEMANTICS_SIG_CONSTRAINTS_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože jeden nebo více atributů podpisu neodpovídá omezením pro ověřování platnosti.
SEMANTICS_CHAIN_CONSTRAINTS_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože řetězec certifikátů použitý v procesu ověřování platnosti neodpovídá omezením pro ověřování platnosti vztahujícím se k certifikátu.
SEMANTICS_CERTIFICATE_CHAIN_GENERAL_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože sada certifikátů dostupných pro ověření platnosti řetězce vyvolala chybu z blíže neurčeného důvodu.
SEMANTICS_CRYPTO_CONSTRAINTS_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože alespoň jeden z algoritmů, které byly použity v materiálu (např. hodnota podpisu, certifikát...) zapojeném do ověřování platnosti podpisu, nebo velikost klíče použitého s takovým algoritmem, je pod požadovanou úrovní kryptografické bezpečnosti, a: tento materiál byl vytvořen po čase, do kterého byl tento algoritmus/klíč považován za bezpečný (je-li takový čas znám); a tento materiál není chráněn dostatečně silným časovým razítkem aplikovaným před časem, do kterého byl algoritmus/klíč považován za bezpečný (je-li takový čas znám).
SEMANTICS_POLICY_PROCESSING_ERROR=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože daný soubor formální politiky nebylo možné z jakéhokoli důvodu zpracovat (např. nedostupný, nečitelný, neshoda otisku atd.).
SEMANTICS_SIGNATURE_POLICY_NOT_AVAILABLE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože elektronický dokument obsahující podrobnosti politiky není dostupný.
SEMANTICS_TIMESTAMP_ORDER_FAILURE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože nejsou dodržena některá omezení týkající se pořadí časových razítek podpisu a/nebo časových razítek podepsaných datových objektů.
SEMANTICS_NO_SIGNING_CERTIFICATE_FOUND=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože podpisový certifikát nelze identifikovat.
SEMANTICS_NO_CERTIFICATE_CHAIN_FOUND=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože pro identifikovaný podpisový certifikát nebyl nalezen žádný řetězec certifikátů.
SEMANTICS_REVOKED_NO_POE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože podpisový certifikát byl k datu/času ověření zneplatněn. Algoritmus ověřování platnosti podpisu však nemůže stanovit, zda čas podpisu leží před časem zneplatnění nebo po něm.
SEMANTICS_REVOKED_CA_NO_POE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože byl nalezen alespoň jeden řetězec certifikátů, ale certifikát mezilehlé CA je zneplatněn.
SEMANTICS_OUT_OF_BOUNDS_NOT_REVOKED=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože podpisový certifikát je k datu/času ověření po expiraci nebo dosud neplatný a algoritmus ověřování platnosti podpisu nemůže stanovit, že čas podpisu leží v intervalu platnosti podpisového certifikátu. O certifikátu je známo, že není zneplatněn.
SEMANTICS_OUT_OF_BOUNDS_NO_POE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože podpisový certifikát je k datu/času ověření po expiraci nebo dosud neplatný a algoritmus ověřování platnosti podpisu nemůže stanovit, že čas podpisu leží v intervalu platnosti podpisového certifikátu.
SEMANTICS_REVOCATION_OUT_OF_BOUNDS_NO_POE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože podpisový certifikát informací o zneplatnění podpisového certifikátu podpisu je k datu/času ověření po expiraci nebo dosud neplatný a algoritmus ověřování platnosti podpisu nemůže stanovit, že čas vydání informací o zneplatnění leží v intervalu platnosti podpisového certifikátu těchto informací o zneplatnění.
SEMANTICS_CRYPTO_CONSTRAINTS_FAILURE_NO_POE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože alespoň jeden z algoritmů, které byly použity v objektech (např. hodnota podpisu, certifikát atd.) zapojených do ověřování platnosti podpisu, nebo velikost klíče použitého s takovým algoritmem, je pod požadovanou úrovní kryptografické bezpečnosti, a neexistuje důkaz, že tento materiál byl vytvořen před časem, do kterého byl tento algoritmus/klíč považován za bezpečný.
SEMANTICS_NO_POE=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože chybí POE k tomu, aby bylo možné stanovit, že podepsaný objekt byl vytvořen před nějakou kompromitující událostí (např. prolomený algoritmus).
SEMANTICS_TRY_LATER=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože pomocí dostupných informací nelze splnit všechna omezení. Může to však být možné s využitím dodatečných informací o zneplatnění, které budou dostupné v pozdějším čase.
SEMANTICS_SIGNED_DATA_NOT_FOUND=Proces ověřování platnosti podpisu vyústil ve stav INDETERMINATE, protože podepsaná data nelze získat.
