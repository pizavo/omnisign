# OmniSign web — nginx server block for the Compose/Wasm bundle.
# Copied to /etc/nginx/conf.d/default.conf by composeApp/Dockerfile; the base
# image's nginx.conf supplies the surrounding events{} / http{} context.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the large text-based assets (JS glue, wasm, css) on the wire.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm text/css application/json image/svg+xml;

    # WebAssembly.instantiateStreaming() rejects any media type other than
    # application/wasm, so it is forced here regardless of the base image's
    # mime.types version. Hashed .wasm filenames are content-addressed and may be
    # cached indefinitely.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html references stable-named entry scripts, so it must always be
    # revalidated or a redeploy would be hidden behind a stale cached shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Lightweight container healthcheck target, kept out of the access log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: serve the requested asset when it exists, otherwise fall
    # back to the shell rather than returning a hard 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
