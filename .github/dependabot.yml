version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
          - 'org.jetbrains.compose*'
          - 'com.google.devtools.ksp*'
      dss:
        patterns:
          - 'eu.europa.ec.joinup.sd-dss*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      docusaurus:
        patterns:
          - '@docusaurus/*'
      openapi-docs:
        patterns:
          - 'docusaurus-*-openapi-docs'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - '/.github/actions/*'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
