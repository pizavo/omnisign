name: CI — Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          module-path: server

      - uses: ./.github/actions/setup-gradle
        if: steps.detect.outputs.relevant == 'true'

      - name: Build and test
        if: steps.detect.outputs.relevant == 'true'
        run: ./gradlew :shared:jvmTest :server:test :server:buildFatJar
