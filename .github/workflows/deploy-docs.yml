name: Deploy Docs — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'shared/src/**'
      - 'cli/src/**'
      - 'composeApp/src/**'
      - 'server/src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Generate Dokka API docs
        run: ./gradlew :dokkaGenerate

      - uses: ./.github/actions/setup-docs

      - name: Copy Dokka output into static directory
        run: |
          mkdir -p docs/static/api
          cp -r build/dokka/html/* docs/static/api/

      - name: Build Docusaurus site
        working-directory: docs
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

