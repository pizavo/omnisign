name: Deploy Docs — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'shared/src/**'
      - 'cli/src/**'
      - 'composeApp/src/**'
      - 'server/src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Generate Dokka API docs
        run: ./gradlew :dokkaGenerate

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      # postman-code-generators, pulled in by docusaurus-theme-openapi-docs, runs a postinstall that
      # picks a package manager with detect-package-manager. That looks for a lockfile in its own
      # directory, finds none, and falls back to probing for a global yarn *before* a global pnpm.
      # The runner image ships yarn 1, which then refuses to run at all because docs/package.json
      # pins pnpm through "packageManager". A yarn that fails its version probe makes the fallback
      # reach pnpm instead, so the postinstall does its real work rather than dying on the mismatch.
      - name: Install docs dependencies
        working-directory: docs
        run: |
          mkdir -p "$RUNNER_TEMP/pm-shim"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/pm-shim/yarn"
          chmod +x "$RUNNER_TEMP/pm-shim/yarn"
          PATH="$RUNNER_TEMP/pm-shim:$PATH" pnpm install --frozen-lockfile

      - name: Copy Dokka output into static directory
        run: |
          mkdir -p docs/static/api
          cp -r build/dokka/html/* docs/static/api/

      - name: Build Docusaurus site
        working-directory: docs
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

