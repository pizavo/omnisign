name: Release — Server

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the computed version and notes without tagging or releasing"
        type: boolean
        default: false
      release_as:
        description: "Force an explicit version (e.g. 1.0.0) instead of the computed bump; leave empty to auto-compute"
        type: string
        default: ""
      prerelease:
        description: "Cut a pre-release: append a -<suffix>.N identifier and flag the GitHub release as a pre-release"
        type: boolean
        default: false
      prerelease_suffix:
        description: "Pre-release identifier used when 'prerelease' is checked (e.g. pre, rc, beta)"
        type: string
        default: "pre"

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version & notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      should_release: ${{ steps.r.outputs.should_release }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: r
        uses: ./.github/actions/compute-release
        with:
          tag-prefix: server
          module-path: server
          github-token: ${{ github.token }}
          release-as: ${{ github.event.inputs.release_as }}
          prerelease: ${{ github.event.inputs.prerelease }}
          prerelease-suffix: ${{ github.event.inputs.prerelease_suffix }}

      - name: Upload release notes
        if: steps.r.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-and-release:
    name: Build, Dockerize & Release
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Run tests
        run: ./gradlew :shared:jvmTest :server:test

      - name: Build fat JAR
        run: ./gradlew :server:buildFatJar -PreleaseVersion=${{ needs.prepare.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/omnisign-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease != 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/

      # Full release: softprops uploads then publishes, which immutable releases allow.
      - name: Create GitHub Release
        if: ${{ needs.prepare.outputs.prerelease != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Server v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          files: server/build/libs/*-all.jar

      # Pre-release: softprops publishes before uploading, which an immutable release
      # rejects — so upload assets to a mutable draft, then publish it.
      - name: Create draft pre-release
        id: prerelease
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Server v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          prerelease: true
          draft: true
          files: server/build/libs/*-all.jar

      - name: Publish pre-release
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/${{ steps.prerelease.outputs.id }}" -F draft=false
