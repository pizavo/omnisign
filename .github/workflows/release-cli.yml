name: Release — CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the computed version and notes without tagging or releasing"
        type: boolean
        default: false
      release_as:
        description: "Force an explicit version (e.g. 1.0.0) instead of the computed bump; leave empty to auto-compute"
        type: string
        default: ""
      prerelease:
        description: "Cut a pre-release: append a -<suffix>.N identifier and flag the GitHub release as a pre-release"
        type: boolean
        default: false
      prerelease_suffix:
        description: "Pre-release identifier used when 'prerelease' is checked (e.g. pre, rc, beta)"
        type: string
        default: "pre"

permissions:
  contents: read

env:
  WIX_VERSION: '6.0.2'

jobs:
  prepare:
    name: Compute version & notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      should_release: ${{ steps.r.outputs.should_release }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: r
        uses: ./.github/actions/compute-release
        with:
          tag-prefix: cli
          module-path: cli
          github-token: ${{ github.token }}
          release-as: ${{ github.event.inputs.release_as }}
          prerelease: ${{ github.event.inputs.prerelease }}
          prerelease-suffix: ${{ github.event.inputs.prerelease_suffix }}

      - name: Upload release notes
        if: steps.r.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test — ${{ matrix.os }}
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Run tests
        run: ./gradlew :shared:jvmTest :cli:test

  build-linux:
    name: Package — Linux
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Install tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y librsvg2-bin rpm

      - name: Build shadow JAR and Linux packages
        run: ./gradlew :cli:shadowJar :cli:jpackageDeb :cli:jpackageRpm :cli:jpackageLinuxImage -PreleaseVersion=${{ needs.prepare.outputs.version }}

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-linux
          path: cli/build/jpackage/**/jpackage-*.txt
          if-no-files-found: ignore

      - name: Tar portable app-image
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tar -czf "cli/build/jpackage/omnisign-cli-${version}-linux-portable.tar.gz" \
            -C "cli/build/jpackage/linux-image" .

      - name: Upload fat JAR
        uses: actions/upload-artifact@v7
        with:
          name: cli-jar
          path: cli/build/libs/omnisign-*.jar
          if-no-files-found: error

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-deb
          path: cli/build/jpackage/linux-deb/*.deb
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-rpm
          path: cli/build/jpackage/linux-rpm/*.rpm
          if-no-files-found: error

      - name: Upload portable tarball
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-portable
          path: cli/build/jpackage/*-linux-portable.tar.gz
          if-no-files-found: error

  build-windows:
    name: Package — Windows
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Install ImageMagick
        shell: powershell
        run: choco install imagemagick -y

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          wix extension add --global WixToolset.UI.wixext/${{ env.WIX_VERSION }}
          wix extension add --global WixToolset.Util.wixext/${{ env.WIX_VERSION }}

      - name: Build Windows packages
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}
        run: ./gradlew :cli:jpackageWinExe :cli:jpackageWinMsi

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-windows
          path: cli/build/jpackage/**/jpackage-*.txt
          if-no-files-found: ignore

      - name: Zip portable app-image
        shell: powershell
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path "cli\build\jpackage\win-image\*" `
            -DestinationPath "cli\build\jpackage\omnisign-cli-${version}-win-portable.zip" -Force

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows-msi
          path: cli/build/jpackage/win-msi/*.msi
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: cli-windows-portable
          path: cli/build/jpackage/*-win-portable.zip
          if-no-files-found: error

  build-macos:
    name: Package — macOS
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Install librsvg
        run: brew install librsvg

      - name: Build macOS packages
        run: ./gradlew :cli:jpackageDmg :cli:jpackagePkg -PreleaseVersion=${{ needs.prepare.outputs.version }}

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-macos
          path: cli/build/jpackage/**/jpackage-*.txt
          if-no-files-found: ignore

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: cli-macos-dmg
          path: cli/build/jpackage/mac/*.dmg
          if-no-files-found: error

      - name: Upload PKG
        uses: actions/upload-artifact@v7
        with:
          name: cli-macos-pkg
          path: cli/build/jpackage/mac-pkg/*.pkg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build-linux, build-windows, build-macos]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: artifacts/
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/

      # Full release: softprops uploads then publishes, which immutable releases allow.
      - name: Create release
        if: ${{ needs.prepare.outputs.prerelease != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "CLI v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          files: artifacts/*

      # Pre-release: softprops publishes before uploading, which an immutable release
      # rejects — so upload assets to a mutable draft, then publish it.
      - name: Create draft pre-release
        id: prerelease
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "CLI v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          prerelease: true
          draft: true
          files: artifacts/*

      - name: Publish pre-release
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/${{ steps.prerelease.outputs.id }}" -F draft=false
