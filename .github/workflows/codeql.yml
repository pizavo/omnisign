name: "CodeQL Advanced"

# The analysis matrix is computed per run instead of being hardcoded: a PR that
# touches only Markdown or Gradle plumbing has nothing for the Kotlin extractor
# to say, and java-kotlin costs ~280s against ~60s and ~40s for the other two.
# Full scans (schedule, manual dispatch) always cover every language, because a
# CodeQL query-pack update can flag code that has not changed in months.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  languages:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Keep the build modes here in step with what each extractor needs;
          # this list is the single source of truth for the analyze matrix.
          all='[{"language":"actions","build-mode":"none"},{"language":"java-kotlin","build-mode":"autobuild"},{"language":"javascript-typescript","build-mode":"none"}]'

          emit() {
            echo "matrix=$1" >> "$GITHUB_OUTPUT"
            echo "any=$2" >> "$GITHUB_OUTPUT"
            echo "event=$EVENT -> $1"
          }

          # Scheduled and manual runs are the safety net: never narrow them.
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            emit "$all" true; exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; head="$PR_HEAD"; else base="$PUSH_BEFORE"; head="$PUSH_AFTER"; fi
          # New branch / unknown base -> analyse everything rather than guess.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            emit "$all" true; exit 0
          fi

          changed=$(git diff --name-only "$base" "$head" || true)

          langs=()
          # *.gradle.kts is Kotlin script, and gradle/ + gradle.properties drive
          # the autobuild, so a toolchain or dependency change has to re-extract.
          if printf '%s\n' "$changed" | grep -qE '\.(kt|kts|java)$|^gradle/|^gradle\.properties$'; then
            langs+=('{"language":"java-kotlin","build-mode":"autobuild"}')
          fi
          # The JS extractor reads sources, not .mdx, so the Docusaurus prose in
          # docs/ deliberately does not trigger it.
          if printf '%s\n' "$changed" | grep -qE '\.(js|jsx|ts|tsx|mjs|cjs)$|(^|/)package\.json$'; then
            langs+=('{"language":"javascript-typescript","build-mode":"none"}')
          fi
          if printf '%s\n' "$changed" | grep -qE '^\.github/(workflows|actions)/'; then
            langs+=('{"language":"actions","build-mode":"none"}')
          fi

          if [ ${#langs[@]} -eq 0 ]; then
            emit '[]' false
          else
            emit "$(IFS=,; printf '[%s]' "${langs[*]}")" true
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
