name: CI — Web

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          module-path: composeApp

      - uses: ./.github/actions/setup-gradle
        if: steps.detect.outputs.relevant == 'true'

      - name: Test and build Wasm distribution
        if: steps.detect.outputs.relevant == 'true'
        run: ./gradlew :shared:wasmJsBrowserTest :composeApp:wasmJsBrowserTest :composeApp:wasmJsBrowserDistribution

      - name: Upload Wasm test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-reports
          path: |
            shared/build/reports/tests/wasmJsBrowserTest/
            composeApp/build/reports/tests/wasmJsBrowserTest/
          if-no-files-found: ignore
