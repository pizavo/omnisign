name: Release — Desktop

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the computed version and notes without tagging or releasing"
        type: boolean
        default: false
      release_as:
        description: "Force an explicit version (e.g. 1.0.0) instead of the computed bump; leave empty to auto-compute"
        type: string
        default: ""

permissions:
  contents: read

env:
  WIX_VERSION: '6.0.2'

jobs:
  prepare:
    name: Compute version & notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      should_release: ${{ steps.r.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: r
        uses: ./.github/actions/compute-release
        with:
          tag-prefix: desktop
          module-path: composeApp
          github-token: ${{ github.token }}
          release-as: ${{ github.event.inputs.release_as }}

      - name: Upload release notes
        if: steps.r.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  test:
    name: Test — ${{ matrix.os }}
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Run tests
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest

  build-linux:
    name: Package — Linux
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Install tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm

      - name: Build Linux packages
        run: >-
          ./gradlew
          :composeApp:packageDeb :composeApp:packageRpm :composeApp:packageAppImage
          -PreleaseVersion=${{ needs.prepare.outputs.version }}

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-linux
          path: |
            composeApp/build/compose/logs/
            composeApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore

      - name: Tar portable app-image
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tar -czf "composeApp/build/omnisign-desktop-${version}-linux-portable.tar.gz" \
            -C "composeApp/build/compose/binaries/main/app" .

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-rpm
          path: composeApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

      - name: Upload portable tarball
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-portable
          path: composeApp/build/*-linux-portable.tar.gz
          if-no-files-found: error

  build-windows:
    name: Package — Windows
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          wix extension add --global WixToolset.UI.wixext/${{ env.WIX_VERSION }}
          wix extension add --global WixToolset.Util.wixext/${{ env.WIX_VERSION }}

      - name: Build Windows packages
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.prepare.outputs.version }}
        run: >-
          ./gradlew
          :composeApp:packageMsi :composeApp:packageExe :composeApp:createDistributable

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-windows
          path: |
            composeApp/build/compose/logs/
            composeApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore

      - name: Zip portable app-image
        shell: powershell
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path "composeApp\build\compose\binaries\main\app\*" `
            -DestinationPath "composeApp\build\omnisign-desktop-${version}-win-portable.zip" -Force

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-exe
          path: composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-portable
          path: composeApp/build/*-win-portable.zip
          if-no-files-found: error

  build-macos:
    name: Package — macOS
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Build macOS packages
        run: >-
          ./gradlew
          :composeApp:packageDmg :composeApp:createDistributable
          -PreleaseVersion=${{ needs.prepare.outputs.version }}

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-macos
          path: |
            composeApp/build/compose/logs/
            composeApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore

      - name: Tar portable app bundle
        run: |
          version="${{ needs.prepare.outputs.version }}"
          tar -czf "composeApp/build/omnisign-desktop-${version}-macos-portable.tar.gz" \
            -C "composeApp/build/compose/binaries/main/app" .

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      - name: Upload portable tarball
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-portable
          path: composeApp/build/*-macos-portable.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build-linux, build-windows, build-macos]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: artifacts/
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Desktop v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          files: artifacts/*
