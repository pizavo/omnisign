name: Release — Web

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the computed version and notes without tagging or releasing"
        type: boolean
        default: false
      release_as:
        description: "Force an explicit version (e.g. 1.0.0) instead of the computed bump; leave empty to auto-compute"
        type: string
        default: ""
      prerelease:
        description: "Cut a pre-release: append a -<suffix>.N identifier and flag the GitHub release as a pre-release"
        type: boolean
        default: false
      prerelease_suffix:
        description: "Pre-release identifier used when 'prerelease' is checked (e.g. pre, rc, beta)"
        type: string
        default: "pre"

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version & notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      should_release: ${{ steps.r.outputs.should_release }}
      prerelease: ${{ steps.r.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: r
        uses: ./.github/actions/compute-release
        with:
          tag-prefix: web
          module-path: composeApp
          github-token: ${{ github.token }}
          release-as: ${{ github.event.inputs.release_as }}
          prerelease: ${{ github.event.inputs.prerelease }}
          prerelease-suffix: ${{ github.event.inputs.prerelease_suffix }}

      - name: Upload release notes
        if: steps.r.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build Web (Wasm)
    needs: prepare
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Build Wasm distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution -PreleaseVersion=${{ needs.prepare.outputs.version }}

      - name: Zip Wasm distribution
        run: |
          cd composeApp/build/dist/wasmJs/productionExecutable
          zip -r "$GITHUB_WORKSPACE/composeApp/build/web-dist.zip" .

      - name: Upload web distribution
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: composeApp/build/web-dist.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.should_release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download web distribution
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: artifacts/

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes/

      # Full release: softprops uploads then publishes, which immutable releases allow.
      - name: Create release
        if: ${{ needs.prepare.outputs.prerelease != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Web v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          files: artifacts/*

      # Pre-release: softprops publishes before uploading, which an immutable release
      # rejects — so upload assets to a mutable draft, then publish it.
      - name: Create draft pre-release
        id: prerelease
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Web v${{ needs.prepare.outputs.version }}"
          body_path: notes/release-notes.md
          prerelease: true
          draft: true
          files: artifacts/*

      - name: Publish pre-release
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/${{ steps.prerelease.outputs.id }}" -F draft=false
