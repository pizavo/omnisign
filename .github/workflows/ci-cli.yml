name: CI — CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CLI — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          module-path: cli

      - uses: ./.github/actions/setup-gradle
        if: steps.detect.outputs.relevant == 'true'

      - name: Build and test
        if: steps.detect.outputs.relevant == 'true'
        run: ./gradlew :shared:jvmTest :cli:test :cli:shadowJar
