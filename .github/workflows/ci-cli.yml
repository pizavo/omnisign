name: CI — CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.c.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: c
        uses: ./.github/actions/detect-changes
        with:
          module-path: cli

  build:
    name: Build & Test — ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-gradle

      - name: Build and test
        run: ./gradlew :shared:jvmTest :cli:test :cli:shadowJar

  ci-cli:
    name: ci-cli
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          echo "changes=${{ needs.changes.result }}/${{ needs.changes.outputs.relevant }} build=${{ needs.build.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then echo "::error::change detection did not succeed"; exit 1; fi
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then echo "::error::CLI build/test failed"; exit 1; fi
          echo "OK (build: ${{ needs.build.result }})"
