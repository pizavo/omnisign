name: CI — Desktop

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          module-path: composeApp

      - uses: ./.github/actions/setup-gradle
        if: steps.detect.outputs.relevant == 'true'

      - name: Build and test
        if: steps.detect.outputs.relevant == 'true'
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest :composeApp:createDistributable

      - name: Install tooling
        if: steps.detect.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y rpm

      - name: Build Linux packages
        if: steps.detect.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: ./gradlew :composeApp:packageDeb :composeApp:packageRpm

      # Checks that the dependencies resolve on the oldest Ubuntu the DEB targets and on Fedora,
      # and that the RPM claims no directory Fedora's filesystem package owns. The maintainer
      # scripts are left out: they register the app with a desktop menu a bare container lacks.
      - name: Check the Linux packages install
        if: steps.detect.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          docker run --rm -v "$PWD/composeApp/build/compose/binaries/main/deb:/pkg:ro" ubuntu:22.04 sh -ec '
            apt-get update -q
            apt-get install -s -q --no-install-recommends /pkg/*.deb
          '
          docker run --rm -v "$PWD/composeApp/build/compose/binaries/main/rpm:/pkg:ro" fedora:latest sh -ec '
            dnf install -y -q --setopt=install_weak_deps=False --setopt=tsflags=noscripts /pkg/*.rpm
          '

      - name: Verify third-party notices
        if: steps.detect.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: ./gradlew generateThirdPartyNotices -PnoticesCheck=true

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-${{ matrix.os }}
          path: |
            composeApp/build/compose/logs/
            composeApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore
