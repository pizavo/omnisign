name: CI — Desktop

on:
  push:
    branches: [main]
    paths:
      - 'composeApp/**'
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          module-path: composeApp

      - uses: ./.github/actions/setup-gradle
        if: steps.detect.outputs.relevant == 'true'

      - name: Build and test
        if: steps.detect.outputs.relevant == 'true'
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest :composeApp:createDistributable

      - name: Upload jpackage logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jpackage-logs-${{ matrix.os }}
          path: |
            composeApp/build/compose/logs/
            composeApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore
